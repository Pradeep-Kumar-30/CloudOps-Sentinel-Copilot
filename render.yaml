services:
  - type: web
    name: cloudops-sentinel-copilot
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-large
      - key: EMBEDDING_DIMENSION
        value: "3072"
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: cloudops-sentinel-openai-self-rag
      - key: PINECONE_NAMESPACE
        value: incident-runbooks
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
      - key: TAVILY_API_KEY
        sync: false
      - key: TOP_K
        value: "5"
      - key: MAX_SUPPORT_RETRIES
        value: "2"
      - key: MAX_RETRIEVAL_REWRITES
        value: "2"
      - key: MAX_WEB_REWRITES
        value: "2"
      - key: DATABASE_PATH
        value: data/audit.db
